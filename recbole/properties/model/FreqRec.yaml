hidden_size: 64
inner_size: 256
num_hidden_layers: 2
num_attention_heads: 4
hidden_act: 'gelu'
layer_norm_eps: 1e-12
initializer_range: 0.02
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
loss_type: 'CE'

alpha: 0.3               # Weight between filter layer and attention layer
gama: 0.8                # Weight between temporal MLP and channel MLP

chux: 'p'

# Fourier Loss Settings
fourier_loss: True       # Whether to use the frequency domain consistency loss
alpha_loss: 0.7          # Weight of the main recommendation loss (1 - alpha_loss for fourier_loss)
fft_loss_type: 'l2'      # Options: 'l1', 'l2', 'SmoothL1Loss', 'mix_loss'
